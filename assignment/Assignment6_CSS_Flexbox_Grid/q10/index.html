<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combined Layout</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="logo">MySite</div>
    <nav class="nav">
      <a href="#">Home</a>
      <a href="#">Blog</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main class="main">
    <article class="article">
      <h1 class="title">Welcome to My Site</h1>
      <div class="boxes">
        <div class="box">Box A</div>
        <div class="box">Box B</div>
        <div class="box">Box C</div>
      </div>
      <p>This article area demonstrates Flexbox used inside a CSS Grid layout, combining
         both techniques for a responsive page structure.</p>
    </article>
    <aside class="sidebar">
      <h3>Sidebar</h3>
      <p>Links, ads, or related content go here.</p>
    </aside>
  </main>

  <footer class="footer">
    <p>&copy; 2026 MySite. All rights reserved.</p>
  </footer>
</body>
</html>
