<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Flip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene">
    <div class="card">
      <div class="face front">
        <img src="https://placehold.co/180x120" alt="Card front">
        <h3>Flip Card</h3>
      </div>
      <div class="face back">
        <p>Hover reveals this description on the back of the card, using a 3D rotation.</p>
      </div>
    </div>
  </div>
</body>
</html>
