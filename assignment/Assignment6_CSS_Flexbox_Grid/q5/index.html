<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="pricing">
    <div class="card">
      <h3>Basic</h3>
      <p class="amount">$9/mo</p>
      <p>Good for individuals</p>
    </div>
    <div class="card highlighted">
      <h3>Pro</h3>
      <p class="amount">$19/mo</p>
      <p>Most popular choice</p>
    </div>
    <div class="card">
      <h3>Premium</h3>
      <p class="amount">$29/mo</p>
      <p>For growing teams</p>
    </div>
  </main>
</body>
</html>
