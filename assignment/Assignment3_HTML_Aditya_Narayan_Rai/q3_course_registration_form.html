<!DOCTYPE html>
<!-- 
  Task 3: Create a Course Registration Form structure using HTML only.
  - <fieldset> and <legend> for grouping fields.
  - A <select> dropdown for selecting a course.
  - <input> fields for name and email.
  - A <table> at the bottom showing available course schedules (Day, Time, Instructor).
-->
<html lang="en">
<head>
    <title>Course Registration Form</title>
</head>
<body>

    <h1>Course Registration Form</h1>

    <fieldset>
        <legend>Student Details</legend>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name"><br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>

        <label for="course">Select Course:</label>
        <select id="course" name="course">
            <option value="webdev">Web Development</option>
            <option value="cybersecurity">Cybersecurity</option>
            <option value="datascience">Data Science</option>
            <option value="ai">Artificial Intelligence</option>
        </select>

    </fieldset>

    <h2>Available Course Schedules</h2>
    <table border="1">
        <tr>
            <th>Day</th>
            <th>Time</th>
            <th>Instructor</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>10:00 AM - 12:00 PM</td>
            <td>Dr. Sharma</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>2:00 PM - 4:00 PM</td>
            <td>Prof. Verma</td>
        </tr>
        <tr>
            <td>Friday</td>
            <td>11:00 AM - 1:00 PM</td>
            <td>Dr. Gupta</td>
        </tr>
    </table>

</body>
</html>
