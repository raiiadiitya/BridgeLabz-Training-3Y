<!DOCTYPE html>
<!-- 
  Task 10: Create a Dropdown-based Selection Page:
  - Add multiple <select> dropdowns for: Country, State, City, Favorite Tourist Place
  - Each dropdown must have a pre-selected option.
  - Add a <p> summarizing your choices.
-->
<html lang="en">
<head>
    <title>Dropdown Selection Page</title>
</head>
<body>

    <h1>Travel Preference Selector</h1>

    <label for="country">Country:</label>
    <select id="country" name="country">
        <option value="usa">USA</option>
        <option value="india" selected>India</option>
        <option value="japan">Japan</option>
    </select>
    <br><br>

    <label for="state">State:</label>
    <select id="state" name="state">
        <option value="up" selected>Uttar Pradesh</option>
        <option value="rajasthan">Rajasthan</option>
        <option value="kerala">Kerala</option>
    </select>
    <br><br>

    <label for="city">City:</label>
    <select id="city" name="city">
        <option value="mathura" selected>Mathura</option>
        <option value="agra">Agra</option>
        <option value="lucknow">Lucknow</option>
    </select>
    <br><br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place" name="place">
        <option value="tajmahal" selected>Taj Mahal</option>
        <option value="krishnajanmabhoomi">Krishna Janmabhoomi</option>
        <option value="fatehpursikri">Fatehpur Sikri</option>
    </select>
    <br><br>

    <p>
        Based on the selections above, the default preferences shown are 
        India, Uttar Pradesh, Mathura, and Taj Mahal as the favorite tourist place.
    </p>

</body>
</html>
