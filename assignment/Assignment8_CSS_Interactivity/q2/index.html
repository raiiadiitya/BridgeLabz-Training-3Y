<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tooltip Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <span class="tooltip-item">Hover Me
      <span class="tooltip-text">This is a CSS-only tooltip</span>
    </span>
    <span class="tooltip-item">Icon &#9733;
      <span class="tooltip-text">Favorite this item</span>
    </span>
    <span class="tooltip-item">Info &#9432;
      <span class="tooltip-text">Extra information here</span>
    </span>
  </main>
</body>
</html>
