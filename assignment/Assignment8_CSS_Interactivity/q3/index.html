<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Showcase</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="grid">
    <figure><div class="img-wrap"><img src="https://placehold.co/300x200" alt="Photo 1"><div class="overlay"></div></div><figcaption>Sunset View</figcaption></figure>
    <figure><div class="img-wrap"><img src="https://placehold.co/300x200" alt="Photo 2"><div class="overlay"></div></div><figcaption>City Skyline</figcaption></figure>
    <figure><div class="img-wrap"><img src="https://placehold.co/300x200" alt="Photo 3"><div class="overlay"></div></div><figcaption>Green Hills</figcaption></figure>
    <figure><div class="img-wrap"><img src="https://placehold.co/300x200" alt="Photo 4"><div class="overlay"></div></div><figcaption>Ocean Shore</figcaption></figure>
    <figure><div class="img-wrap"><img src="https://placehold.co/300x200" alt="Photo 5"><div class="overlay"></div></div><figcaption>Desert Road</figcaption></figure>
    <figure><div class="img-wrap"><img src="https://placehold.co/300x200" alt="Photo 6"><div class="overlay"></div></div><figcaption>Winter Trees</figcaption></figure>
  </main>
</body>
</html>
