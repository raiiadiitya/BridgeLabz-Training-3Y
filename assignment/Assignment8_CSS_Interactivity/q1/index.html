<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pseudo-Classes Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Pseudo-Classes Demonstration</h1></header>
  <main class="row">
    <div class="example">
      <a href="#" class="hover-link">Hover Link</a>
      <p>:hover changes link color</p>
    </div>
    <div class="example">
      <input type="text" class="focus-input" placeholder="Click me">
      <p>:focus highlights the input</p>
    </div>
    <div class="example">
      <button class="active-btn">Press Me</button>
      <p>:active darkens on click</p>
    </div>
    <div class="example">
      <ul class="nth-list">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
      </ul>
      <p>:nth-child(even) shades rows</p>
    </div>
  </main>
</body>
</html>
