<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outline and Focus Form</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="form-wrap">
    <h1>Contact Form</h1>
    <form>
      <label for="name">Name</label>
      <input type="text" id="name" class="solid-outline" placeholder="Your name">

      <label for="email">Email</label>
      <input type="email" id="email" class="dotted-outline" placeholder="you@example.com">

      <label for="message">Message</label>
      <textarea id="message" class="dashed-outline" rows="4" placeholder="Your message"></textarea>

      <button type="button">Submit</button>
    </form>
  </main>
</body>
</html>
