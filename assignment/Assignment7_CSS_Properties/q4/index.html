<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadows and Depth</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cards">
    <div class="card card1">
      <h3>Soft Shadow</h3>
      <p>A subtle, close box-shadow for gentle depth.</p>
    </div>
    <div class="card card2">
      <h3>Offset Shadow</h3>
      <p>A shadow offset to one side for a raised look.</p>
    </div>
    <div class="card card3">
      <h3>Deep Shadow</h3>
      <p>A larger, softer shadow for strong depth.</p>
    </div>
  </main>
</body>
</html>
