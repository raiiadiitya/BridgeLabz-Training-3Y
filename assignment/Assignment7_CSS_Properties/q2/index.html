<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Height and Width Practice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <div class="box box-px">width: 150px<br>height: 150px</div>
    <div class="box box-percent">width: 40%<br>min-height: 100px</div>
    <div class="box box-vh">height: 30vh<br>max-width: 200px</div>
    <div class="box box-overflow">overflow: auto<br>This box has a fixed height and extra text to demonstrate the overflow property scrolling inside a limited box area.</div>
  </main>
</body>
</html>
