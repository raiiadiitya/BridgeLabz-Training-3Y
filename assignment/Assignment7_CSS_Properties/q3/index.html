<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradient Backgrounds</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">Gradient Background Demo</header>

  <main>
    <section class="linear-section">
      <h2>Linear Gradient</h2>
      <p>This section uses a linear-gradient background that transitions smoothly across the page and stays fixed while you scroll.</p>
    </section>
    <section class="radial-section">
      <h2>Radial Gradient</h2>
      <p>This section uses a radial-gradient background, radiating outward from the center point.</p>
    </section>
  </main>

  <footer class="site-footer">&copy; 2026 Gradient Demo</footer>
</body>
</html>
