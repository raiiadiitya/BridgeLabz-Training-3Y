<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transformations Showcase</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="row">
    <div class="item">
      <div class="box rotate-box">Rotate</div>
      <p>rotate(45deg) on hover</p>
    </div>
    <div class="item">
      <div class="box scale-box">Scale</div>
      <p>scale(1.3) on hover</p>
    </div>
    <div class="item">
      <div class="box translate-box">Translate</div>
      <p>translate(0, -15px) on hover</p>
    </div>
    <div class="item">
      <div class="box skew-box">Skew</div>
      <p>skew(15deg, 5deg) on hover</p>
    </div>
  </main>
</body>
</html>
