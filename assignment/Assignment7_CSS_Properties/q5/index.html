<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advanced CSS Selectors</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Advanced Selectors Demo</h1>

    <section class="attr-demo">
      <h2>Attribute Selectors</h2>
      <input type="text" placeholder="type='text' input">
      <input type="email" placeholder="type='email' input">
      <p><a href="https://example.com">Secure link (href^="https")</a></p>
      <p><a href="http://example.com">Insecure link</a></p>
    </section>

    <section class="list-demo">
      <h2>Pseudo-classes and Combinators</h2>
      <ul class="item-list">
        <li>Item one</li>
        <li>Item two</li>
        <li>Item three</li>
        <li>Item four</li>
        <li>Item five</li>
      </ul>
    </section>

    <section class="quote-demo">
      <h2>Pseudo-elements</h2>
      <p class="quote">This paragraph has generated content before and after it.</p>
    </section>
  </main>
</body>
</html>
