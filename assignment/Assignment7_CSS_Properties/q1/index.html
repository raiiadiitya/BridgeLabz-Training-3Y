<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Borders and Padding Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Borders and Padding Demonstration</h1>
  </header>
  <main class="box-row">
    <div class="box solid">Solid Border<br><small>padding: 10px</small></div>
    <div class="box dashed">Dashed Border<br><small>padding: 20px</small></div>
    <div class="box double">Double Border<br><small>padding: 15px</small></div>
    <div class="box groove">Groove Border<br><small>padding: 25px</small></div>
    <div class="box rounded">Rounded Corners<br><small>border-radius: 20px</small></div>
  </main>
</body>
</html>
