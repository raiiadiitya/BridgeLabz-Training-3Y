<!DOCTYPE html>
<!-- 
  Task 6: Use the <blockquote> tag to display a meaningful quote 
  and mention the author's name using <cite>.
-->
<html lang="en">
<head>
    <title>Blockquote Example</title>
</head>
<body>

    <blockquote>
        The only way to do great work is to love what you do.
    </blockquote>
    <p>— <cite>Steve Jobs</cite></p>

</body>
</html>
