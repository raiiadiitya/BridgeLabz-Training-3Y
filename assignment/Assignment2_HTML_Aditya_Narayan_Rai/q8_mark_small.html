<!DOCTYPE html>
<!-- 
  Task 8: Write a paragraph containing:
  - A highlighted word using <mark>
  - A small note at the end using <small> (e.g., "Updated recently").
-->
<html lang="en">
<head>
    <title>Mark and Small Example</title>
</head>
<body>

    <p>
        My favorite subject in college is <mark>Cybersecurity</mark>, 
        and I enjoy exploring its many practical applications. 
        <small>(Updated recently)</small>
    </p>

</body>
</html>
