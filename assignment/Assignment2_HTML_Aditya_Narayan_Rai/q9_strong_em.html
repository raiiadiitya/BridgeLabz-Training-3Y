<!DOCTYPE html>
<!-- 
  Task 9: Create a paragraph that uses both <strong> and <em> 
  to emphasize different parts of a sentence.
-->
<html lang="en">
<head>
    <title>Strong and Em Example</title>
</head>
<body>

    <p>
        It is <strong>very important</strong> to practice coding daily, 
        and it also helps to stay <em>curious</em> while learning new concepts.
    </p>

</body>
</html>
