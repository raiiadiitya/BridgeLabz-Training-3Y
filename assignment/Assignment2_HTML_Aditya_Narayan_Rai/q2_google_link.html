<!DOCTYPE html>
<!-- 
  Task 2: Add a hyperlink (<a>) to Google with suitable link text.
  Make sure the link opens in a new tab.
-->
<html lang="en">
<head>
    <title>Google Link</title>
</head>
<body>

    <!-- target="_blank" opens the link in a new tab -->
    <!-- rel="noopener noreferrer" is added for security best practice -->
    <p>
        You can search for anything on the web using 
        <a href="https://www.google.com" target="_blank" rel="noopener noreferrer">Google Search</a>.
    </p>

</body>
</html>
