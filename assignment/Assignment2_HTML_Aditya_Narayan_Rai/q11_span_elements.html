<!DOCTYPE html>
<!-- 
  Task 11: Write a paragraph that contains three <span> elements — 
  use them to highlight or label different parts of the text 
  (you can imagine colors or meanings).
-->
<html lang="en">
<head>
    <title>Span Elements Example</title>
</head>
<body>

    <p>
        My name is <span title="Full Name">Aditya Narayan Rai</span>, 
        I study <span title="Field of Study">Computer Science Engineering</span>, 
        and my specialization is <span title="Specialization">Cybersecurity</span>.
    </p>

</body>
</html>
