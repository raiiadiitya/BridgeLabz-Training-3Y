<!DOCTYPE html>
<!-- 
  Task 12: Create a creative paragraph combining multiple inline elements 
  (<strong>, <em>, <mark>, <small>, <br>) to demonstrate inline formatting.
-->
<html lang="en">
<head>
    <title>Creative Inline Formatting</title>
</head>
<body>

    <p>
        Welcome to my <strong>very first</strong> HTML assignment!<br>
        I am learning to build webpages, and it feels <em>truly exciting</em>.<br>
        My favorite part so far has been the <mark>inline elements</mark> section.
        <small>(Last updated recently)</small>
    </p>

</body>
</html>
