<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body style="background-color: rgb(46, 166, 164); color: rgb(241, 240, 244); font-family: 'Courier New', Courier, monospace;"></body>>
    <div style="text-align: center;font-size:25px;"><p><b><h1>Intership Application Form</h1></b></p></div>
    <h1><b>Personal Information :</b></h1>
    <b>Your Name : </b><input type="text" name="name" placeholder="Write your name here..">

    <br><br>
    <b>Your Phone : </b><input type="tel" name="phone" placeholder="Write your phone number here..">
    <br><br>
    <b>Date of Birth : </b><input type="date" name="dob">
    <br><br>
    <password><b>Password : </b><input type="password" name="password" placeholder="Write your password here..">
        <br><br>
    <gender><b>Gender : </b>
    <input type="radio" name="gender" value="male">
    <label for="male">Male</label>
    <input type="radio" name="gender" value="female">
    <label for="female">Female</label>
    <input type="radio" name="gender" value="other">
    <label for="other">Other</label>
    <br><br>
    <b>Course : </b><select name="course">
        <option value="CSE">CSE</option>
        <option value="IT">IT</option>

    </select>

    <br><br>
    <h2><b>Preference : </b></h2>
    <input type="checkbox" name="preference" value="Frontend">
    <label for="Frontend">Frontend</label>
    <input type="checkbox" name="preference" value="Backend">
    <label for="Backend">Backend</label>

    <h2><b>Upload your Resume : </b></h2>
    Resume : <input type="file" name="resume">
